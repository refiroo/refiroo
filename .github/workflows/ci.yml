name: CI

on:
  # Branches only: a tag pushed with its commit would run the same checks a second time.
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    # Ubuntu 24.04, not ubuntu-latest (26.04): Playwright's Chromium does not install on 26.04 yet.
    runs-on: ubuntu-24.04
    # 90 until the suite's CI time is known (it passed 79% in 40 minutes on 2026-11-07); then lowered again.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      # The test harness uses this server instead of starting its own (tests/postgres_server.py).
      RDM_TEST_DATABASE_SERVER: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e 'backend[dev]'
      - run: python -m ruff check backend
      # Parallel part, then the timing-based `serial` tests in one process (docs/testing/EXECUTION_GUIDE.md).
      - run: python -m pytest backend/tests -n auto -q -rfE --durations=30
      - run: python -m pytest backend/tests -m serial -q

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # The harness helper test launches a headless Chromium.
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:gate-helpers
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
