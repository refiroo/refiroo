name: CI

on:
  # Branches only: a tag pushed with its commit would run the same checks a second time.
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    # Four shares on four runners (.github/ci/ci_shard.py): the whole suite on one runner (2 cores,
    # 8 GB) ran out of memory three quarters through and took over 70 minutes (2026-11-08).
    name: backend (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Ubuntu 24.04, not ubuntu-latest (26.04): Playwright's Chromium does not install on 26.04 yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      # The test harness uses this server instead of starting its own (tests/postgres_server.py).
      RDM_TEST_DATABASE_SERVER: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      CI_SHARD: ${{ matrix.shard }}/4
      PYTHONPATH: ${{ github.workspace }}/.github/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e 'backend[dev]'
      - run: python -m ruff check backend
        if: matrix.shard == 1
      # Parallel part, then the timing-based `serial` tests in one process (docs/testing/EXECUTION_GUIDE.md).
      - run: python -m pytest backend/tests -p ci_shard -n auto -q -rfE
      # Exit code 5: this share holds no serial test.
      - run: python -m pytest backend/tests -p ci_shard -m serial -q || test $? -eq 5

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # The harness helper test launches a headless Chromium.
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:gate-helpers
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
