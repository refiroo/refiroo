name: CI

on:
  # Branches only: a tag pushed with its commit would run the same checks a second time.
  push:
    branches: ["**"]
  pull_request:

# Both jobs only read the repository: no job writes to it, to packages or to checks (0.17 RF4).
permissions:
  contents: read

jobs:
  backend:
    # A quick gate on every push: the linter and the unit tests. The full suite (journeys, volumes,
    # budgets) runs on a developer's machine before a release (docs/testing/EXECUTION_GUIDE.md); on
    # GitHub's runner it took a whole runner hour per push (2026-11-08).
    # Ubuntu 24.04, not ubuntu-latest (26.04): Playwright's Chromium does not install on 26.04 yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The test harness uses this server instead of starting its own (tests/postgres_server.py).
      RDM_TEST_DATABASE_SERVER: postgresql+psycopg://postgres:ci-db-secret-7f3a@localhost:5432/postgres
    steps:
      # Started here and not as a job service: a service's whole log is printed when the job ends, and
      # it holds the refusals the tests provoke on purpose (a duplicate key, for one). Here the log is
      # printed only when a step failed (0.17 RF7).
      - name: Start PostgreSQL
        run: |
          docker run -d --name ci-postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD=ci-db-secret-7f3a \
            -e POSTGRES_INITDB_ARGS="--locale-provider=icu --icu-locale=und --locale=C" \
            postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
          for attempt in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U postgres -h 127.0.0.1 && exit 0
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - run: pip install -c backend/constraints.txt -e 'backend[dev]'
      - run: python -m ruff check backend
      - run: python -m pytest backend/tests/unit -n auto -q -rfE
      - name: PostgreSQL log (failed runs only)
        if: failure()
        run: docker logs ci-postgres
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f ci-postgres > /dev/null

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # The harness helper test launches a headless Chromium.
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:gate-helpers
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
