# The reference installation (0.12 DP2, D405–D409): the database, the engine and the web image that
# serves the application and forwards the engine's paths. Fill .env from .env.example, put the
# certificate and key in ./certs, then:
#   docker compose up -d --build
#   docker compose run --rm engine python -m app.cli.create_admin --username <name> --name "<Name>"
# Only `web` is published. Keep the engine and the database off the network: the engine trusts the
# caller address `web` forwards, so a caller reaching it directly could pretend to be anyone.
name: refiroo

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rdm
      POSTGRES_USER: rdm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      # The ICU root collation the engine requires (PG-D11).
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und --locale=C"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdm -d rdm"]
      interval: 5s
      timeout: 3s
      retries: 10

  engine:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://rdm:${POSTGRES_PASSWORD}@database:5432/rdm
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?Set SECRETS_ENCRYPTION_KEY in .env (see .env.example)}
      RDM_CURSOR_SIGNING_KEY: ${RDM_CURSOR_SIGNING_KEY:?Set RDM_CURSOR_SIGNING_KEY in .env (see .env.example)}
      # The address people open: the issuer of the engine's tokens, where sign-in returns to and
      # the host passkeys are bound to.
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env (see .env.example)}
      CORS_ORIGINS: ${PUBLIC_URL}
      # `web` is the only caller (the engine is not published), and it replaces what callers send.
      FORWARDED_ALLOW_IPS: "*"
      # Capabilities: the engine's own defaults unless .env sets them (docs/OPERATIONS.md).
      MODEL_ADMIN_MUTATIONS_ENABLED: ${MODEL_ADMIN_MUTATIONS_ENABLED:-false}
      WORKSPACE_ADMIN_MUTATIONS_ENABLED: ${WORKSPACE_ADMIN_MUTATIONS_ENABLED:-true}
      INTEGRATION_JOBS_ENABLED: ${INTEGRATION_JOBS_ENABLED:-true}
      CONSUMER_SUBSCRIPTIONS_ENABLED: ${CONSUMER_SUBSCRIPTIONS_ENABLED:-false}
    volumes:
      - job-files:/data/job-files
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      WEB_TLS: ${WEB_TLS:-files}
      ENGINE_UPSTREAM: http://engine:8000
    ports:
      - "${WEB_HTTP_PORT:-80}:8080"
      - "${WEB_HTTPS_PORT:-443}:8443"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      engine:
        condition: service_healthy

volumes:
  database:
  job-files:
