# Automatic HTTPS for a public installation (0.12 DP4): Caddy in front of `web` gets and renews a
# Let's Encrypt (or ZeroSSL) certificate for the name in PUBLIC_URL. Needs that name's DNS pointing at
# this host and ports 80 and 443 reachable from the internet. Use it on top of compose.yml:
#   docker compose -f compose.yml -f compose.acme.yml up -d --build
# No certificate files and no ./certs folder are needed. Not for a name only your network knows (the
# certificate authority could not reach it): use the default, with your own certificate files.
services:
  web:
    # Plain HTTP behind Caddy, which ends HTTPS and is the only published service.
    ports: !reset []
    volumes: !reset []
    environment:
      WEB_TLS: proxy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates and the account with the authority: keep this volume; losing it means
      # asking for new certificates, which the authority limits.
      - caddy-data:/data
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy-data:
