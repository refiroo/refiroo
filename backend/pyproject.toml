[project]
name = "rdm-engine-backend"
version = "0.17.1"
description = "Model-driven reference data management engine"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=46,<48",
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.20,<5",
  "markdown-it-py>=4,<5",
  "mcp>=1.30,<2",
  "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.1,<3",
  "psycopg[binary]>=3.2,<4",
  "pyjwt>=2.10,<3",
  "webauthn>=2.7,<3",
  "segno>=1.6,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "openapi-spec-validator>=0.9,<1",
  "pytest>=8.3,<9",
  "pytest-xdist>=3.6,<4",
  "coverage>=7.17,<8",  # the journey recording run (tests/journey_trace.py --record)
  "httpx2>=2.0,<3",  # starlette.testclient builds on it; with httpx alone it warns
  "ruff==0.16.5",  # one linter for CI and the developer instance: rule sets change between minors
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# `-n auto` runs modules in parallel, each module on one worker (TEST_HARNESS_PLAN H2), and journey
# tests one at a time (tests/conftest.py, S1).
addopts = ["--strict-markers", "--dist", "loadfile"]
# A warning fails the test: the run prints none (0.17 RF7). Exceptions go below, one per third-party
# warning that cannot be fixed from our side, naming the package, the message and the reason.
filterwarnings = ["error"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.migrations" = ["script.py.mako"]
"app.management.reference" = [
  "scalar/standalone.js",
  "scalar/LICENSE",
  "content/*.md",
  "content/examples/*.json",
]
"app.management" = ["passkey.js", "brand/*.png"]
"app.engine.mail" = ["brand/*.png"]

[tool.ruff]
line-length = 100
target-version = "py314"
