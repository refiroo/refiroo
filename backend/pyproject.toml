[project]
name = "rdm-engine-backend"
version = "0.10.0-alpha.1"
description = "Model-driven reference data management engine"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=46,<48",
  "fastapi>=0.115,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "openapi-spec-validator>=0.9,<1",
  "pytest>=8.3,<9",
  "pytest-xdist>=3.6,<4",
  "pytest-testmon>=2.2,<3",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# `-n auto` runs modules in parallel, each module on one worker (TEST_HARNESS_PLAN H2).
addopts = ["--strict-markers", "--dist", "loadfile"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.migrations" = ["script.py.mako"]
"app.management.reference" = ["scalar/standalone.js", "scalar/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py314"
