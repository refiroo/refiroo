services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rdm
      POSTGRES_USER: rdm
      POSTGRES_PASSWORD: rdm
    volumes:
      - rdm-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdm -d rdm"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://rdm:rdm@database:5432/rdm
      RDM_MODEL_PATH: /model/rdm-starter.json
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  rdm-data:

